# Loft walker config (merged over walker's defaults).
theme = "loft"
force_keyboard_focus = true
close_when_open = true
click_to_close = true
selection_wrap = true
# niri blurs behind the sheet (ext-background-effect-v1).
ext_background_effect_blur = true
blur_corner_radius = 26

[placeholders]
"default" = { input = "Spotlight Search", list = "No Results" }

[providers]
# Plain queries: apps (by fuzzy match + how often you open them), open
# windows, commands + script commands (launcher/elephant-commands), the
# calculator — math, units, currencies, time zones (launcher/elephant-calculator)
# — and bangs: Quicklinks (yt, np, gm …), the default web search and
# "Open <url>" (launcher/elephant-bangs). "?" lists every prefix.
default = ["desktopapplications", "windows", "commands", "calculator", "bangs"]
empty = ["desktopapplications"]
max_results = 40

# walker's defaults give "!" to todo; prefixes merge by provider, so move it.
[[providers.prefixes]]
prefix = "+"
provider = "todo"

[[providers.prefixes]]
prefix = "!"
provider = "bangs"

[[providers.prefixes]]
prefix = ";"
provider = "providerlist"

[[providers.prefixes]]
prefix = ">"
provider = "runner"

[[providers.prefixes]]
prefix = "/"
provider = "files"

[[providers.prefixes]]
prefix = "."
provider = "symbols"

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"

[[providers.prefixes]]
prefix = "="
provider = "calculator"

# elephant's own calc is off (the calculator replaces it); walker's default
# "=" for it would shadow the calculator's.
[[providers.prefixes]]
prefix = "=calc:"
provider = "calc"

[[providers.prefixes]]
prefix = "?"
provider = "commands"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

# !bangs and Quicklinks. Enter/Tab on a bang (or an exact quicklink) scopes
# Spotlight to it — the query becomes "!nixpkgs " and the next words are the
# search; Backspace on the empty term leaves. "scope" needs walker with
# launcher/walker-set-query.patch.
[providers.actions]
bangs = [
  { action = "scope", label = "search in", default = true, bind = "Return", after = "Nothing" },
  { action = "scope", label = "complete", bind = "Tab", after = "Nothing" },
  { action = "search", label = "search", default = true, bind = "Return" },
  { action = "open", label = "open", default = true, bind = "Return" },
  { action = "home", label = "open site", bind = "ctrl Return" },
  { action = "quicklink", label = "create quicklink", bind = "ctrl k" },
]

# Commands: dangerous ones confirm first (Enter → "Shut Down?" → Enter);
# script commands with arguments scope like bangs ("Generate Password " +
# the arguments). "query" puts a prefix into the field (help rows, Emoji…).
commands = [
  { action = "run", default = true, bind = "Return" },
  { action = "confirm", label = "run…", default = true, bind = "Return", after = "Nothing" },
  { action = "query", label = "open", default = true, bind = "Return", after = "Nothing" },
  { action = "scope", label = "arguments", default = true, bind = "Return", after = "Nothing" },
  { action = "scope", label = "arguments", bind = "Tab", after = "Nothing" },
  { action = "cancel", default = true, bind = "Return", after = "Nothing" },
  { action = "edit", label = "edit script", bind = "ctrl e" },
  { action = "reveal", label = "show in folder", bind = "ctrl r" },
]

# Calculator: Enter copies the answer ("3.1069 mi"), Ctrl+Enter just the
# number, Shift+Enter qalc's full precision.
calculator = [
  { action = "copy", default = true, bind = "Return" },
  { action = "copy_number", label = "copy number", bind = "ctrl Return" },
  { action = "copy_full", label = "copy exact", bind = "shift Return" },
  { action = "try", label = "try", default = true, bind = "Return", after = "Nothing" },
]
