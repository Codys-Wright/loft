# `nix flake check` on every push to main, and by hand (Actions → Checks →
# Run workflow, or `gh workflow run checks.yml --ref <branch>`); not on pull
# requests (too slow for every PR). nix/checks.nix is the whole gate. It
# already covers the Rust crates: loft-niri, loft-appmenu, loft-sleep and
# loft-input are buildRustPackage derivations that run their `cargo test` in
# checkPhase, each with a `-clippy` sibling (-D warnings).
#
# Runs on THEBATTLESHIP's `github-loft` runner (label `loft`, declared in
# Codys-Wright/nix-config hosts/THEBATTLESHIP/github-runners.nix). The job
# builds through that host's Nix daemon, so niri-loft, the patched KWin and
# the crates' deps are already in its /nix/store and only what a push changed
# builds: a few minutes, against ~40 on a hosted runner, where the Magic Nix
# Cache was throttled and nearly everything rebuilt. The repo is public, so
# the runner's job-started hook refuses anything but a push to main or a
# workflow_dispatch, and the job runs as an unprivileged user (`loft-ci`).
# The job uses no secrets; checkout doesn't keep the token in .git/config.
#
# Fallback: `gh workflow run checks.yml -f hosted=true` runs the same check
# on ubuntu-latest (with Nix installed and the Magic Nix Cache), e.g. while
# THEBATTLESHIP is down.
name: Checks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hosted:
        description: Run on GitHub's ubuntu-latest instead of THEBATTLESHIP (slow, ~40 min)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flake-check:
    name: nix flake check
    runs-on: ${{ inputs.hosted && 'ubuntu-latest' || fromJSON('["self-hosted", "loft"]') }}
    timeout-minutes: ${{ inputs.hosted && 120 || 60 }}
    steps:
      # Hosted fallback only: niri-loft builds niri and runs its test suite;
      # a cold build needs more than the ~14 GB the hosted image leaves free.
      - name: Free disk space
        if: inputs.hosted
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - if: inputs.hosted
        uses: DeterminateSystems/nix-installer-action@main

      - if: inputs.hosted
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      # --no-update-lock-file: a flake.lock that doesn't match flake.nix fails.
      - name: nix flake check
        run: nix flake check --no-update-lock-file --keep-going --print-build-logs
