; Loft theme "${name}" — generated by `loft theme render`, do not edit.
;
; Loft's KWin decoration (dev.loft.decoration, kdecoration/) reads this file
; and repaints open windows when it changes. The title bar wears the colors
; niri-loft's bar gets (niri-loft.kdl), so a window looks the same under KWin
; and niri. Colors are #rrggbb or #rrggbbaa; lengths are logical pixels.

[Colors]
TitleBarActive=${title_bar_active}
TitleBarInactive=${title_bar_inactive}
TextActive=${title_bar_text}
TextInactive=${title_bar_text_inactive}
Close=${traffic_close}
Minimize=${traffic_minimize}
Maximize=${traffic_zoom}
ButtonInactive=${traffic_inactive}
Glyph=${traffic_glyph}
ShadowActive=${shadow}
ShadowInactive=${shadow_inactive}

[Metrics]
CornerRadius=${window_radius}
TitleBarHeight=24
ButtonSize=12
ButtonSpacing=8
ButtonInset=10
FontSize=11
