# Loft theme "${name}" — generated by `loft theme render`, do not edit.
# Use from ghostty's config:  config-file = ?~/.local/state/loft/current/ghostty.conf
# Reloaded live by `loft theme apply` (SIGUSR2).

foreground = ${text}
background = ${bg}
selection-foreground = ${selection_fg}
selection-background = ${selection_bg}
cursor-color = ${cursor}
cursor-text = ${cursor_text}

palette = 0=${color0}
palette = 1=${color1}
palette = 2=${color2}
palette = 3=${color3}
palette = 4=${color4}
palette = 5=${color5}
palette = 6=${color6}
palette = 7=${color7}
palette = 8=${color8}
palette = 9=${color9}
palette = 10=${color10}
palette = 11=${color11}
palette = 12=${color12}
palette = 13=${color13}
palette = 14=${color14}
palette = 15=${color15}

# Glass: translucent background, blurred by the compositor behind it.
background-opacity = ${terminal_opacity}
background-blur = ${glass_blur}
${ghostty_fonts}
