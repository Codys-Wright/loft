; Spotify (Spicetify, spicetify-themes' `text` theme): the ${name} theme's
; color scheme, generated by Loft from its palette. `loft spotify` merges these
; sections into the text theme's color.ini; the first one is the theme's scheme.
; A pack replaces it with apps/spicetify.ini (docs/THEME-FORMAT.md).
[loft]
accent             = ${spice_accent}
accent-active      = ${spice_accent_active}
accent-inactive    = ${spice_accent_inactive}
banner             = ${spice_banner}
border-active      = ${spice_border_active}
border-inactive    = ${spice_border_inactive}
header             = ${spice_header}
highlight          = ${spice_highlight}
main               = ${spice_main}
notification       = ${spice_notification}
notification-error = ${spice_notification_error}
subtext            = ${spice_subtext}
text               = ${spice_text}
main-elevated      = ${spice_main_elevated}
highlight-elevated = ${spice_highlight_elevated}
sidebar            = ${spice_sidebar}
player             = ${spice_player}
card               = ${spice_card}
shadow             = ${spice_shadow}
selected-row       = ${spice_selected_row}
button             = ${spice_button}
button-active      = ${spice_button_active}
button-disabled    = ${spice_button_disabled}
tab-active         = ${spice_tab_active}
misc               = ${spice_misc}
