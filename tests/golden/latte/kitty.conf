# studio-linux theme "latte" — generated by `studio theme render`, do not edit.
# Use from kitty.conf:  include ~/.local/state/studio-linux/current/kitty.conf
# Reloaded live by `studio theme apply` (SIGUSR1).

foreground #4c4f69
background #eff1f5
selection_foreground #4c4f69
selection_background #bcc0cc
cursor #4c4f69
cursor_text_color #eff1f5
url_color #1e66f5

active_border_color #1e66f5
inactive_border_color #bcc0cc
bell_border_color #df8e1d

active_tab_foreground #eff1f5
active_tab_background #1e66f5
inactive_tab_foreground #6c6f85
inactive_tab_background #e6e9ef
tab_bar_background #eff1f5

mark1_foreground #eff1f5
mark1_background #1e66f5
mark2_foreground #eff1f5
mark2_background #8839ef
mark3_foreground #eff1f5
mark3_background #df8e1d

color0 #4c4f69
color1 #d20f39
color2 #40a02b
color3 #df8e1d
color4 #1e66f5
color5 #8839ef
color6 #1ed1f5
color7 #bcc0cc
color8 #6c6f85
color9 #ac0c2f
color10 #338022
color11 #bb7718
color12 #0a52e0
color13 #7113ec
color14 #0abce0
color15 #e6e9ef

