# Loft theme "latte" — generated by `loft theme render`, do not edit.
# Use from ghostty's config:  config-file = ?~/.local/state/loft/current/ghostty.conf
# Reloaded live by `loft theme apply` (SIGUSR2).

foreground = #4c4f69
background = #eff1f5
selection-foreground = #4c4f69
selection-background = #bcc0cc
cursor-color = #4c4f69
cursor-text = #eff1f5

palette = 0=#4c4f69
palette = 1=#d20f39
palette = 2=#40a02b
palette = 3=#df8e1d
palette = 4=#1e66f5
palette = 5=#8839ef
palette = 6=#1ed1f5
palette = 7=#bcc0cc
palette = 8=#6c6f85
palette = 9=#ac0c2f
palette = 10=#338022
palette = 11=#bb7718
palette = 12=#0a52e0
palette = 13=#7113ec
palette = 14=#0abce0
palette = 15=#e6e9ef

# Glass: translucent background, blurred by the compositor behind it.
background-opacity = 0.85
background-blur = true
# Loft reloads this file (SIGUSR2) on every theme or Transparency change:
# no "Reloaded the configuration" toast for those (copy toasts stay).
app-notifications = clipboard-copy,no-config-reload

