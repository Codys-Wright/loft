[package]
name = "loft-kwin"
version = "0.1.0"
description = "Loft's KWin backend: loads the loft-bridge KWin script and relays KWin's windows and desktops to the shell as niri-shaped line-JSON"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "loft-kwin"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
png = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "io-std", "io-util", "sync", "time", "signal"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
