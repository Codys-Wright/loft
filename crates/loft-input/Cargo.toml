[package]
name = "loft-input"
version = "0.1.0"
description = "Loft test driver: virtual pointer + keyboard (loft-input) and agent-friendly screenshots (loft-shot) for nested or live niri sessions; Auto Scroll helper for scrolling capture (loft-pointer)"
edition.workspace = true
repository.workspace = true

[[bin]]
name = "loft-input"
path = "src/bin/loft-input.rs"

[[bin]]
name = "loft-shot"
path = "src/bin/loft-shot.rs"

# Auto Scroll for scrolling capture (`loft capture scroll` → `auto`).
[[bin]]
name = "loft-pointer"
path = "src/bin/loft-pointer.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
# Must speak the IPC of the niri we ship (nixpkgs niri 26.04).
niri-ipc = "=26.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Keybinds of the session's niri config (`loft-input bind`).
loft-niri = { path = "../loft-niri" }
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkeysym = "0.2"
