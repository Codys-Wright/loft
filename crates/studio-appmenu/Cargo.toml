[package]
name = "studio-appmenu"
version = "0.1.0"
description = "studio-linux global menu daemon: com.canonical.AppMenu.Registrar + DBusMenu / org.gtk.Menus reader, line-JSON on stdin/stdout"
edition.workspace = true
repository.workspace = true

[[bin]]
name = "studio-appmenu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "io-std", "io-util", "sync", "time"] }
x11rb = "0.14.0"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
