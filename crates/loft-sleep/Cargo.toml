[package]
name = "loft-sleep"
version = "0.1.0"
description = "Loft sleep watcher: turns Bluetooth off before the system sleeps and back on after (logind PrepareForSleep, BlueZ)"
edition.workspace = true
repository.workspace = true

[[bin]]
name = "loft-sleep"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "time"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
