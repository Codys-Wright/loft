[package]
name = "studio-input"
version = "0.1.0"
description = "studio-linux test driver: virtual pointer + keyboard (studio-input) and agent-friendly screenshots (studio-shot) for nested or live niri sessions"
edition.workspace = true
repository.workspace = true

[[bin]]
name = "studio-input"
path = "src/bin/studio-input.rs"

[[bin]]
name = "studio-shot"
path = "src/bin/studio-shot.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
# Must speak the IPC of the niri we ship (nixpkgs niri 26.04).
niri-ipc = "=26.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Keybinds of the session's niri config (`studio-input bind`).
studio-niri = { path = "../studio-niri" }
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkeysym = "0.2"
