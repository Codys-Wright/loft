[General]
# The theme pack the login screen follows: a directory with theme.json,
# greeter.json and optionally lock/ (the design) and wallpaper.*.
# `loft greeter sync` (or `loft theme apply --greeter`) points it at a copy
# under /var/lib/loft/themes through a polkit-allowed helper (PLAN §4.5).
packDir=/var/lib/loft/greeter
